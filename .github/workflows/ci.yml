name: CI Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Correr tests
        run: node --test > test-results.txt

      - name: Subir resultados
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt
